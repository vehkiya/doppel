name: Validate

on:
  workflow_call:

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Verify go.mod and go.sum are tidy
        run: go mod tidy -diff

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0

      - name: Run Unit Tests
        run: go test -v -race ./...

  # macOS matters beyond compiling: its filesystem ignores case, so folder
  # rules use gitdir/i:, and its temp dirs sit behind the /var symlink.
  test-macos:
    name: Test (macOS)
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Run Unit Tests
        run: go test -v -race ./...

  # doppel supports Git 2.34 and later, and relies on --fixed-value,
  # --show-scope and how includeIf treats worktrees. The runner images carry
  # a newer Git, so this job runs in Ubuntu 22.04's own container, which
  # ships Git 2.34.1.
  test-min-git:
    name: Test (Git 2.34)
    runs-on: ubuntu-latest
    container: ubuntu:22.04
    permissions:
      contents: read
    steps:
      - name: Cache apt packages
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        with:
          path: |
            /var/cache/apt/archives
            /var/lib/apt/lists
          key: apt-packages-ubuntu-22.04-git-2.34-${{ runner.arch }}-v1

      - name: Install Git, OpenSSH and a C compiler (for -race)
        run: |
          rm -f /etc/apt/apt.conf.d/docker-clean
          sed -i 's|http://archive.ubuntu.com/ubuntu/|http://azure.archive.ubuntu.com/ubuntu/|g' /etc/apt/sources.list
          sed -i 's|http://security.ubuntu.com/ubuntu/|http://azure.archive.ubuntu.com/ubuntu/|g' /etc/apt/sources.list
          apt-get update
          apt-get install -y --no-install-recommends git openssh-client ca-certificates gcc libc6-dev
          git --version

      - name: Check this is the minimum supported Git
        run: git --version | grep -q 'git version 2\.34\.'

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Run Unit Tests
        run: go test -v -race ./...

  cross-compile:
    name: Compile (${{ matrix.os }}/${{ matrix.arch }})
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
          - os: linux
            arch: arm64
          - os: darwin
            arch: amd64
          - os: darwin
            arch: arm64
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Compile Binary
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: 0
        run: go build -trimpath -ldflags="-s -w" -o "doppel-${{ matrix.os }}-${{ matrix.arch }}" .
