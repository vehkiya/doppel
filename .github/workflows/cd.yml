name: Release Binary Assets

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

# Never cancel a release mid-flight: a run cancelled after pushing its tag would
# leave a tag without a release. Superseded runs skip themselves at the tip check.
concurrency:
  group: cd-release
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/validate.yml
    permissions:
      contents: read

  release:
    name: Build & Publish Release
    needs: validate
    runs-on: ubuntu-latest
    # DOPPEL_SIGNING_KEY lives in this environment, which only the main branch can deploy to.
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Verify Commit is Branch Tip
        id: check_tip
        run: |
          git fetch origin "${{ github.ref_name }}" --tags
          REMOTE_HEAD=$(git rev-parse "origin/${{ github.ref_name }}")
          LOCAL_HEAD=$(git rev-parse HEAD)
          echo "Current runner commit: $LOCAL_HEAD"
          echo "Latest branch commit:  $REMOTE_HEAD"
          if [ "$LOCAL_HEAD" != "$REMOTE_HEAD" ]; then
            echo "is_latest=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Current commit ($LOCAL_HEAD) is superseded by origin/${{ github.ref_name }} ($REMOTE_HEAD). Skipping release to prevent out-of-order release generation."
          else
            echo "is_latest=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Calculate Semantic Version
        if: steps.check_tip.outputs.is_latest == 'true'
        id: version
        uses: PaulHatch/semantic-version@4d6da96a9bc3116da3613309a11ff75fba58eb8d # v6.0.4
        with:
          change_path: "."
          bump_each_commit: false
          tag_prefix: "v"
          major_pattern: "/!:|BREAKING CHANGE:/"
          minor_pattern: "/feat(\\(.+\\))?:/"
          # docs commits don't change the binary, so they don't bump the
          # version. A push with nothing but docs commits since the last tag
          # comes out as version_type "none", and makes no release. A breaking
          # "docs!:" still matches major_pattern.
          ignore_commits_pattern: "/^docs(\\(.+\\))?:/"
          version_format: "${major}.${minor}.${patch}"

      - name: Verify There Is a New Version to Release
        id: check_tag
        if: steps.check_tip.outputs.is_latest == 'true'
        run: |
          VERSION="${{ steps.version.outputs.version_tag }}"
          if [ -z "$VERSION" ]; then
            echo "valid=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${{ steps.version.outputs.version_type }}" = "none" ]; then
            echo "::notice::Nothing to release: no commit since ${VERSION} needs a new version (only docs, or it is already released)."
            echo "valid=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch origin --tags
          if git rev-parse -q --verify "refs/tags/${VERSION}" >/dev/null; then
            echo "::warning::Tag ${VERSION} already exists on remote. Skipping release."
            echo "valid=false" >> "$GITHUB_OUTPUT"
          else
            echo "valid=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Go
        if: steps.check_tip.outputs.is_latest == 'true' && steps.check_tag.outputs.valid == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Build Multi-Platform Release Archives
        if: steps.check_tip.outputs.is_latest == 'true' && steps.check_tag.outputs.valid == 'true'
        run: |
          VERSION="${{ steps.version.outputs.version_tag }}"
          if [ -z "$VERSION" ]; then
            VERSION="v0.1.0"
          fi
          COMMIT=$(git rev-parse --short HEAD)
          BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          PKG="github.com/vehkiya/doppel/internal/version"
          LDFLAGS="-s -w -X ${PKG}.Version=${VERSION} -X ${PKG}.Commit=${COMMIT} -X ${PKG}.BuildDate=${BUILD_DATE}"

          mkdir -p dist

          PLATFORMS=(
            "linux/amd64/doppel"
            "linux/arm64/doppel"
            "darwin/amd64/doppel"
            "darwin/arm64/doppel"
          )

          for p in "${PLATFORMS[@]}"; do
            IFS="/" read -r OS ARCH BINARY <<< "$p"
            STAGE_DIR="dist/doppel_${VERSION}_${OS}_${ARCH}"
            mkdir -p "$STAGE_DIR"

            echo "==> Building ${OS}/${ARCH}..."
            GOOS=$OS GOARCH=$ARCH CGO_ENABLED=0 go build -trimpath -ldflags="$LDFLAGS" -o "$STAGE_DIR/$BINARY" .
            cp README.md LICENSE "$STAGE_DIR/"

            cd dist
            tar -czf "doppel_${VERSION}_${OS}_${ARCH}.tar.gz" "doppel_${VERSION}_${OS}_${ARCH}"
            cp "doppel_${VERSION}_${OS}_${ARCH}.tar.gz" "doppel_${OS}_${ARCH}.tar.gz"
            rm -rf "doppel_${VERSION}_${OS}_${ARCH}"
            cd ..
          done

          cd dist
          sha256sum * > checksums.txt
          cd ..

      - name: Sign Checksums
        if: steps.check_tip.outputs.is_latest == 'true' && steps.check_tag.outputs.valid == 'true'
        env:
          DOPPEL_SIGNING_KEY: ${{ secrets.DOPPEL_SIGNING_KEY }}
        run: |
          if [ -z "$DOPPEL_SIGNING_KEY" ]; then
            echo "::error::DOPPEL_SIGNING_KEY is not configured; refusing to publish an unsigned release."
            exit 1
          fi

          umask 077
          WORK_DIR="$(mktemp -d)"
          trap 'rm -rf "$WORK_DIR"' EXIT
          printf '%s\n' "$DOPPEL_SIGNING_KEY" > "$WORK_DIR/key.pem"

          # Installed binaries only accept keys listed in TrustedKeys, so a key
          # missing from that list would publish a release nobody could update to.
          PUBLIC_KEY="$(openssl pkey -in "$WORK_DIR/key.pem" -pubout -outform DER | tail -c 32 | base64 -w0)"
          if ! grep -qF "\"$PUBLIC_KEY\"" internal/update/update.go; then
            echo "::error::The signing key's public key ($PUBLIC_KEY) is not in TrustedKeys in internal/update/update.go."
            exit 1
          fi

          openssl pkeyutl -sign -inkey "$WORK_DIR/key.pem" -rawin -in dist/checksums.txt -out "$WORK_DIR/checksums.sig"
          openssl pkey -in "$WORK_DIR/key.pem" -pubout -out "$WORK_DIR/public.pem"
          openssl pkeyutl -verify -pubin -inkey "$WORK_DIR/public.pem" -rawin -in dist/checksums.txt -sigfile "$WORK_DIR/checksums.sig"
          base64 -w0 "$WORK_DIR/checksums.sig" > dist/checksums.txt.sig

      - name: Attest Build Provenance
        if: steps.check_tip.outputs.is_latest == 'true' && steps.check_tag.outputs.valid == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/checksums.txt
            dist/checksums.txt.sig

      - name: Generate Changelog
        if: steps.check_tip.outputs.is_latest == 'true' && steps.check_tag.outputs.valid == 'true'
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || true)
          if [ -z "$PREV_TAG" ]; then
            git log --pretty=format:"* %s (%h)" > changelog.txt
          else
            git log "${PREV_TAG}..HEAD" --pretty=format:"* %s (%h)" > changelog.txt
          fi

      - name: Push Git Tag
        if: steps.check_tip.outputs.is_latest == 'true' && steps.check_tag.outputs.valid == 'true'
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git tag ${{ steps.version.outputs.version_tag }}
          git push origin ${{ steps.version.outputs.version_tag }}

      - name: Create GitHub Release
        if: steps.check_tip.outputs.is_latest == 'true' && steps.check_tag.outputs.valid == 'true'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ steps.version.outputs.version_tag }}
          name: Release ${{ steps.version.outputs.version_tag }}
          body_path: changelog.txt
          files: |
            dist/*.tar.gz
            dist/checksums.txt
            dist/checksums.txt.sig
